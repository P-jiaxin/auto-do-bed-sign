name: gotobed
# 测试的话打开这个来测试变量值之类的是否填写正确
# on:
#  push:  # 任何推送到仓库都会触发这个工作流

#on:
#  schedule:
#    - cron: '50 10 * * *' # 10对应的是北京时间晚上六点 50是分钟 表示每天晚上六点五十执行，可以改成任意时间测试

on:
  workflow_dispatch:  # 允许手动触发
  schedule:
    # GitHub Actions 使用 UTC 时间；下面对应北京时间周日到周四 21:05。
    # 选在窗口前段，给 GitHub 调度延迟留一点余量。
    - cron: '5 13 * * 0-4'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pyexecjs requests pytz ddddocr

      - name: Run python script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TOKEN: ${{ secrets.TOKEN }}
          PRINCIPAL: ${{ secrets.PRINCIPAL }}
          CREDENTIAL: ${{ secrets.CREDENTIAL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -c "from datetime import datetime; from zoneinfo import ZoneInfo; import sys; now = datetime.now(ZoneInfo('Asia/Shanghai')); print(f'北京时间：{now:%Y-%m-%d %H:%M:%S}'); sys.exit(1) if (now.weekday() in (4, 5) or not (21 <= now.hour < 23)) else None"
          fi
          python gzlg助手/goToBed.py
        
